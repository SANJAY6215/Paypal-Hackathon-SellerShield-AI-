# Optional PostgreSQL. Then: copy prisma/schema.postgres.prisma over prisma/schema.prisma,
# set DATABASE_URL=postgresql://sellershield:sellershield@localhost:5432/sellershield, run `npm run db:push` in backend/.
services:
  db:
    image: postgres:16
    environment: { POSTGRES_USER: sellershield, POSTGRES_PASSWORD: sellershield, POSTGRES_DB: sellershield }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
volumes:
  pgdata:

# Render Blueprint (UNVERIFIED: prepared from the code, never deployed by the author).
# SQLite lives on a persistent disk, which Render only supports for a single instance (do NOT scale this service beyond 1).
# For multi-instance production use PostgreSQL (see docs/DEPLOYMENT_GUIDE.md) - that path is also unverified.
services:
  - type: web
    name: sellershield-api
    runtime: node
    rootDir: backend
    plan: starter            # persistent disks require a paid plan
    buildCommand: npm install --include=dev && npx prisma generate
    startCommand: npx prisma db push --skip-generate && npm start
    healthCheckPath: /api/health
    disk: { name: sellershield-data, mountPath: /var/data, sizeGB: 1 }
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: DATABASE_URL, value: "file:/var/data/sellershield.db" }
      - { key: JWT_SECRET, generateValue: true }
      - { key: APP_URL, sync: false }          # set to the frontend URL, e.g. https://sellershield-web.onrender.com
      - { key: DEMO_MODE, value: "true" }
      - { key: GEMINI_API_KEY, sync: false }     # optional
      - { key: GROQ_API_KEY, sync: false }       # optional
      - { key: PAYPAL_CLIENT_ID, sync: false }   # optional (Sandbox only)
      - { key: PAYPAL_CLIENT_SECRET, sync: false }
      - { key: PAYPAL_WEBHOOK_ID, sync: false }
  - type: web
    name: sellershield-web
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - { key: API_URL, sync: false }          # backend URL; read at BUILD time by next.config.mjs rewrites
